<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
<title>登录</title>
<meta name="description" content=""/>
<meta name="keywords" content=""/>
<link th:href="@{/auth/css/login.css}" rel="stylesheet"/>
</head>
<body>
      <header>
    	<div class="logo-bar">
    		<h1 class="logo">
    		浙江致一网络科技有限公司
    		</h1>
    	</div> 	
    </header>
     <main class="box">
    	<h1 class="flex">智能商业云</h1>
    	<div class="login-bar ">
			<header class="login-header">
				<h1>安全登录</h1>
			</header>
			<div class="login-body">
					<p th:if="${param.error != null}" class="wrong-bar">
						您输入的密码或账号不正确，请重新输入！ 
					</p>
				<form th:action="@{/auth/login}" method="post">
					<div class="form-group">
						<input type="text" placeholder="账号" name="username" />
					</div>
					<div class="form-group">
						<input type="password" placeholder="密码" name="password" />
					</div>
					<div class="btn-group">
						<input type="submit" class="login-btn" value="安全登陆"/>
					</div>
					<p class="forget">
					
					</p>
				</form>
			</div>
    		
    		
    	</div>
    </main>
</body>
</html>
