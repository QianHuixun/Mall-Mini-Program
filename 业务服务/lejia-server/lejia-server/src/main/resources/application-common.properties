########################################################
### \u5E94\u7528\u914D\u7F6E
########################################################
tofocus.app.name=zyysc-server
tofocus.app.version=@project.version@

feign.hystrix.enabled=true

hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=60000
hystrix.command.default.execution.isolation.strategy=SEMAPHORE

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

eureka.instance.prefer-ip-address=true

########################################################
### rabbitmq
########################################################
spring.rabbitmq.publisher-confirms=true
spring.rabbitmq.virtual-host=/

########################################################
### oauth2
### client-id \u548C \u5BC6\u7801 \u8BF7\u5411\u4E91\u4E2D\u5FC3\u7BA1\u7406\u5458\u7533\u8BF7
########################################################
security.oauth2.client.client-id=zyysc-server
security.oauth2.client.client-secret=${BUSINESS_OAUTH_CLIENT_SECRET:CHANGE_ME}
security.oauth2.resource.id=zyysc-server

###########################

tofocus.notify.sms.warnCid=${SMS_WARN_CID:CHANGE_ME}
tofocus.notify.sms.codeCid=${SMS_CODE_CID:CHANGE_ME}
tofocus.notify.sms.pas=${SMS_PASSWORD:CHANGE_ME}
tofocus.notify.sms.path=/2/sms/send.html
tofocus.notify.sms.uid=${SMS_UID:CHANGE_ME}
tofocus.notify.sms.url=http://api.weimi.cc

########################################################
### \u6570\u636E\u5E93
########################################################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=50
# Java Persistence Api
spring.jpa.database = MYSQL
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = validate
#spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.flyway.enabled=true
spring.main.allow-circular-references=true
management.endpoints.web.exposure.include=info

express.sf.baseUrl=https://butler-ms.sf-express.com

########################################################
### \u4EAC\u4E1CVOP\u76F8\u5173
########################################################
jd.vop.task.enabled=false
jd.vop.openAuth.baseUrl=https://amrtest.xinanshizu.com/jdOpenAuth
jd.vop.api.serverUrl=https://amrtest.xinanshizu.com/jdApi/routerjson
jd.vop.appKey=${JD_VOP_APP_KEY:CHANGE_ME}
jd.vop.appSecret=${JD_VOP_APP_SECRET:CHANGE_ME}
jd.vop.username=\u5929\u6D25\u56FD\u6210VOP
jd.vop.plaintextPassword=${JD_VOP_PASSWORD:CHANGE_ME}
jd.vop.redirectUri=https://cloudtest.xinanshizu.com/zyysc/v1/pub/jdVOP/callbackToken
jd.vop.privateRsaKey=${JD_VOP_PRIVATE_RSA_KEY:CHANGE_ME}
#http client
httpclient.connect.maxTotal=25600
httpclient.connect.maxPerRoute=5
httpclient.connect.timeout=30000
httpclient.httpIdleTimeSec=60
httpclient.retryCount=3
httpclient.maxHttpResponseMb=0.5
