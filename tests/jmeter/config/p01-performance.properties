# P-01 商城首页并发访问性能：开发环境安全基线
business_host=127.0.0.1
business_port=23505
connect_timeout=3000
response_timeout=10000

# 默认 20 并发，20 秒升压，持续 120 秒
perf_threads=20
perf_ramp_time=20
perf_duration=120
perf_think_base_ms=100
perf_think_random_ms=200
perf_max_response_ms=2000

# 报告判定目标（人工查看 HTML 报告）
accept_error_rate_pct=1
accept_avg_ms=800
accept_p95_ms=1500
accept_p99_ms=2500
