########################################################
### 应用配置
########################################################
tofocus.app.name=\u6587\u4EF6\u670D\u52A1
tofocus.app.version=@project.version@

jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD}

spring.cloud.loadbalancer.retry.retryable-status-codes=503
spring.cloud.loadbalancer.retry.retry-on-all-operations=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=GMT+8

eureka.instance.prefer-ip-address=true

spring.main.allow-circular-references=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
########################################################
### rabbitmq
########################################################
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.virtual-host=/

########################################################
### oauth2
### client-id 和 密码 请向云中心管理员申请
########################################################
security.oauth2.client.client-id=@tofocus.file.servicename@
security.oauth2.client.client-secret=${FILE_OAUTH_CLIENT_SECRET:CHANGE_ME}
security.oauth2.resource.id=@tofocus.file.servicename@

########################################################
### 数据库
########################################################
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# HikariCP settings
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5
# Java Persistence Api
spring.jpa.database = MYSQL
spring.jpa.show-sql = false
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.hibernate.naming-strategy = org.hibernate.cfg.ImprovedNamingStrategy
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect

spring.jpa.properties.hibernate.query.plan_cache_max_size=256

spring.flyway.enabled=true

########################################################
### 监控
########################################################
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details= ALWAYS
management.metrics.tags.application:${spring.application.name}

########################################################
### 服务实例配置
### （每实例需要分别设置的配置项）
########################################################
tofocus.file.baseUrl=http://localhost:21003/
tofocus.file.root=uploads
tofocus.file.backup=filebackup
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
tofocus.file.oldApiLimit=-1

tofocus.exception.skipstatck:00300009,00300012
